<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GYM.V</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #050505;
      --card: #111111;
      --card-border: #222222;
      --ash: #888888;
      --ash-light: #d1d1d1;
      --white: #f5f5f5;
      --accent: #333333;
      --pos: #2ecc71;
      --neg: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background-color: var(--bg); color: var(--white); width: 100vw; overflow-x: hidden; }
    body { padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 80px) 16px; min-height: 100vh; }

    /* PIN SCREEN */
    #pinScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    #pinScreen h1 { font-size: 2rem; margin-bottom: 8px; letter-spacing: 4px; }
    #pinScreen p { color: var(--ash-light); margin-bottom: 24px; font-size: 0.9rem; }
    .pin-input { background: #000; border: 2px solid var(--card-border); color: var(--white); font-size: 2rem; padding: 12px; width: 160px; text-align: center; letter-spacing: 12px; border-radius: 8px; margin-bottom: 24px; }
    .pin-btn { background: var(--white); color: #000; padding: 14px 40px; font-size: 1rem; font-weight: 800; border-radius: 6px; border: none; cursor: pointer; }

    /* MAIN APP CONTENT */
    #appContent { display: none; width: 100%; }
    header { padding: 16px 0 12px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
    
    .status-badge { font-size: 0.65rem; font-weight: 700; color: var(--ash); background: var(--card); border: 1px solid var(--card-border); padding: 6px 10px; border-radius: 4px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ash); }
    .dot.live { background: var(--pos); box-shadow: 0 0 5px var(--pos); }
    .dot.err { background: var(--neg); box-shadow: 0 0 5px var(--neg); }

    .tabs { display: flex; gap: 8px; margin: 16px 0; }
    .tab-btn { flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--card-border); color: var(--ash); font-size: 0.85rem; font-weight: 700; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
    .tab-btn.active { color: var(--white); border-color: var(--ash); background: #1c1c1c; }

    .filter-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #000; padding: 4px; border-radius: 6px; border: 1px solid var(--card-border); }
    .filter-btn { flex: 1; padding: 8px; background: transparent; border: none; color: var(--ash); font-size: 0.75rem; font-weight: 700; border-radius: 4px; cursor: pointer; }
    .filter-btn.active { background: var(--card); color: var(--white); }

    .bw-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .bw-row { display: flex; justify-content: space-between; align-items: center; }
    .bw-card label { font-size: 0.8rem; color: var(--ash-light); font-weight: 700; text-transform: uppercase; }
    .bw-input-wrap { display: flex; align-items: center; gap: 8px; }
    .bw-input-wrap input { width: 70px; background: #000; border: 1px solid var(--card-border); color: var(--white); padding: 10px; font-size: 0.95rem; border-radius: 4px; text-align: center; }
    .bw-btn { background: var(--white); color: #000; padding: 10px 14px; font-size: 0.8rem; border-radius: 4px; font-weight: 700; border: none; }
    .bw-pct { font-size: 0.7rem; font-weight: 800; padding: 2px 4px; border-radius: 4px; margin-left: 6px; }
    .date-input { background: #000; border: 1px solid var(--card-border); color: var(--white); padding: 8px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; }

    .exercise-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; margin-bottom: 14px; transition: border 0.3s; }
    .exercise-card.saved { border-color: var(--pos); }
    .ex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .ex-name { font-size: 1rem; font-weight: 700; }
    .loc-badge { font-size: 0.65rem; background: #222; padding: 2px 6px; border-radius: 4px; color: var(--ash-light); text-transform: uppercase; }
    .ex-target { font-size: 0.75rem; color: var(--ash-light); margin-bottom: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }

    .set-row { display: grid; grid-template-columns: 30px 1fr 1fr 40px; gap: 10px; align-items: center; margin-bottom: 12px; }
    .set-label { font-size: 0.75rem; color: var(--ash); font-weight: 700; }
    .input-box { display: flex; flex-direction: column; }
    .input-box span { font-size: 0.6rem; color: var(--ash); margin-bottom: 4px; font-weight: 600; text-align: center; }
    
    .num-ctrl { display: flex; background: #000; border: 1px solid var(--card-border); border-radius: 6px; height: 36px; overflow: hidden; }
    .num-ctrl .btn { width: 34px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; color: var(--ash-light); font-size: 1.2rem; cursor: pointer; user-select: none; font-weight: bold; }
    .num-ctrl input { flex: 1; width: 100%; background: transparent; border: none; color: var(--white); text-align: center; font-size: 0.95rem; font-weight: 700; padding: 0; appearance: none; margin: 0; }
    
    .check-btn { height: 36px; background: #181818; border: 1px solid var(--card-border); color: var(--ash); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; margin-top: 14px; }
    .check-btn.done { background: var(--white); color: #000; font-weight: 800; }

    .set-actions-bar { display: flex; gap: 8px; margin-top: 12px; }
    .add-rem-btn { flex: 1; padding: 8px; background: #000; border: 1px solid var(--card-border); color: var(--ash); font-size: 0.7rem; font-weight: 700; border-radius: 4px; cursor: pointer; }
    
    .save-ex-btn { width: 100%; margin-top: 12px; padding: 12px; background: #181818; border: 1px solid var(--card-border); color: var(--ash-light); font-size: 0.75rem; font-weight: 800; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    .save-ex-btn.saved { background: rgba(46, 204, 113, 0.15); color: var(--pos); border-color: var(--pos); }

    .date-picker-bar { margin-top: 24px; padding: 12px; background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .save-session-btn { width: 100%; padding: 16px; margin: 16px 0 40px; background: var(--white); color: #000; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; border: none; border-radius: 6px; cursor: pointer; }

    .history-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .hist-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--ash); margin-bottom: 12px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; font-weight: 700; }
    .hist-entry { font-size: 0.85rem; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .delete-btn { background: #2a0a0a; color: var(--neg); border: 1px solid var(--neg); font-size: 0.7rem; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: 800; }

    .pct-badge { font-size: 0.7rem; padding: 4px 6px; border-radius: 4px; font-weight: 800; margin-left: 6px; display: inline-block; }
    .pct-pos { color: var(--pos); background: rgba(46, 204, 113, 0.15); }
    .pct-neg { color: var(--neg); background: rgba(231, 76, 60, 0.15); }
    .pct-neu { color: var(--ash); background: rgba(136, 136, 136, 0.15); }

    #progressModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--card); border: 1px solid var(--card-border); width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; text-align: center; }
    .modal-content h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--white); }
    .modal-day-score { font-size: 2.5rem; font-weight: 800; margin-bottom: 16px; }
    .close-modal-btn { width: 100%; padding: 14px; background: var(--white); color: #000; font-weight: 800; border: none; border-radius: 6px; cursor: pointer; margin-top: 16px; }
  </style>
</head>
<body>

  <div id="pinScreen">
    <h1>GYM.V</h1>
    <p id="pinMsg">Enter 4-Digit Security PIN</p>
    <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="pinInput" placeholder="••••">
    <button class="pin-btn" onclick="window.checkPin()">LOGIN</button>
  </div>

  <div id="appContent">
    <header>
      <h1>GYM.V</h1>
      <div class="status-badge">
        <span class="dot" id="cloudDot"></span>
        <span id="cloudStatus">CHECKING NET...</span>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="window.switchTab('workout')">WORKOUT</button>
      <button class="tab-btn" onclick="window.switchTab('history')">HISTORY</button>
    </div>

    <div class="bw-card">
      <div class="bw-row">
        <div>
          <label>Body Weight</label>
          <div style="font-size: 0.75rem; color: var(--ash); margin-top:4px;" id="lastBwDisplay">Last: Not logged</div>
        </div>
        <div class="bw-input-wrap">
          <input type="number" step="0.1" id="bwInput" placeholder="kg">
          <button class="bw-btn" onclick="window.logBodyWeight()">LOG</button>
        </div>
      </div>
      <div class="bw-row" style="border-top: 1px solid var(--card-border); padding-top: 12px;">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--ash-light);">LOG DATE:</span>
        <input type="date" id="bwDate" class="date-input">
      </div>
    </div>

    <div id="workoutView">
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button class="tab-btn active" id="dayABtn" onclick="window.setDay('A')">DAY A (PUSH)</button>
        <button class="tab-btn" id="dayBBtn" onclick="window.setDay('B')">DAY B (PULL)</button>
      </div>
      <div class="filter-tabs">
        <button class="filter-btn active" id="flt-all" onclick="window.setFilter('ALL')">ALL WORKOUTS</button>
        <button class="filter-btn" id="flt-home" onclick="window.setFilter('Home')">HOME ONLY</button>
        <button class="filter-btn" id="flt-gym" onclick="window.setFilter('Gym')">GYM ONLY</button>
      </div>

      <div id="exercisesContainer"></div>
      
      <div class="date-picker-bar">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--ash-light);">WORKOUT DATE:</span>
        <input type="date" id="sessionDate" class="date-input">
      </div>
      <button class="save-session-btn" onclick="window.saveDayAnalysis()">SAVE & ANALYZE DAY</button>
    </div>

    <div id="historyView" style="display: none;">
      <div id="historyList"></div>
    </div>
  </div>

  <div id="progressModal">
    <div class="modal-content">
      <h2>OVERALL DAY PERFORMANCE</h2>
      <div id="modalDayScore" class="modal-day-score pct-pos">+0.0%</div>
      <p style="font-size: 0.8rem; color: var(--ash-light);">Compared to your last matching workout day.</p>
      <button class="close-modal-btn" onclick="window.closeModal()">CONFIRM & SAVE SESSION</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB5zoyx9_f41-e3oBWRoFj5Si2eM9v5uwE",
      authDomain: "gymv-4baac.firebaseapp.com",
      projectId: "gymv-4baac",
      storageBucket: "gymv-4baac.firebasestorage.app",
      messagingSenderId: "21885539570",
      appId: "1:21885539570:web:6480453fee2c5e5979ac6b",
      measurementId: "G-8NWPQN2E63"
    };

    let app, db, isCloudReady = false;

    // True Network Check
    function updateNetworkStatus() {
      const dot = document.getElementById('cloudDot');
      const stat = document.getElementById('cloudStatus');
      if(navigator.onLine) {
        dot.className = 'dot live';
        stat.innerText = 'ONLINE & READY';
      } else {
        dot.className = 'dot err';
        stat.innerText = 'OFFLINE (LOCAL ONLY)';
      }
    }
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      isCloudReady = true;
      updateNetworkStatus();
    } catch (e) {
      document.getElementById('cloudDot').className = 'dot err';
      document.getElementById('cloudStatus').innerText = 'FIREBASE ERROR';
    }

    const DAY_A_EXERCISES = [
      { name: "Neck Curls", loc: "Home", target: "Front Neck", sets: 3, reps: 15, kg: 0 },
      { name: "Push-ups", loc: "Home", target: "Chest & Triceps", sets: 3, reps: 15, kg: 0 },
      { name: "Pike Push-ups", loc: "Home", target: "Shoulders", sets: 3, reps: 10, kg: 0 },
      { name: "Crunches", loc: "Home", target: "Abs", sets: 3, reps: 20, kg: 0 },
      { name: "Stomach Vacuums", loc: "Home", target: "V-Line", sets: 3, reps: 30, kg: 0 },
      { name: "Parallel Bar Dips", loc: "Gym", target: "Lower Chest", sets: 3, reps: 8, kg: 0 },
      { name: "Decline Bench Press", loc: "Gym", target: "Upper Chest", sets: 3, reps: 10, kg: 20 },
      { name: "Front Raises", loc: "Gym", target: "Front Deltoids", sets: 3, reps: 12, kg: 5 },
      { name: "Standing Dumbbell Fly", loc: "Gym", target: "Side Shoulders", sets: 3, reps: 12, kg: 5 },
      { name: "Tricep Overhead Ext", loc: "Gym", target: "Triceps", sets: 3, reps: 10, kg: 7.5 },
      { name: "One Arm Triceps", loc: "Gym", target: "Symmetry", sets: 3, reps: 10, kg: 5 }
    ];

    const DAY_B_EXERCISES = [
      { name: "Neck Extensions", loc: "Home", target: "Back Neck", sets: 3, reps: 15, kg: 0 },
      { name: "Free Squats", loc: "Home", target: "Legs", sets: 3, reps: 30, kg: 0 },
      { name: "Glute Bridges", loc: "Home", target: "Glutes", sets: 3, reps: 15, kg: 0 },
      { name: "Superman Holds", loc: "Home", target: "Lower Back", sets: 3, reps: 30, kg: 0 },
      { name: "Dead Hangs", loc: "Home", target: "Grip/Lats", sets: 3, reps: 10, kg: 0 },
      { name: "Lat Pulldown", loc: "Gym", target: "Back Width", sets: 3, reps: 10, kg: 25 },
      { name: "Back Fly", loc: "Gym", target: "Rear Delts", sets: 3, reps: 12, kg: 5 },
      { name: "Pullovers", loc: "Gym", target: "Ribcage", sets: 3, reps: 10, kg: 10 },
      { name: "Barbell Curl", loc: "Gym", target: "Biceps", sets: 3, reps: 10, kg: 15 },
      { name: "Dumbbell Curl", loc: "Gym", target: "Biceps", sets: 3, reps: 10, kg: 7.5 },
      { name: "Reverse Curl", loc: "Gym", target: "Forearms", sets: 3, reps: 12, kg: 10 },
      { name: "Forearms", loc: "Gym", target: "Forearms", sets: 3, reps: 15, kg: 10 }
    ];

    let currentDay = 'A', currentFilter = 'ALL', appData = { history: [], bodyWeights: [] }, tempDaySession = {}; 
    const MASTER_PIN = "8855";

    window.checkPin = function() {
      let val = document.getElementById('pinInput').value;
      if(val === MASTER_PIN) {
        document.getElementById('pinScreen').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        initDate(); loadData();
      } else {
        alert("Incorrect PIN.");
        document.getElementById('pinInput').value = '';
      }
    };

    function initDate() {
      let d = new Date();
      let localStr = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
      document.getElementById('sessionDate').value = localStr;
      document.getElementById('bwDate').value = localStr;
    }

    function loadData() {
      const local = localStorage.getItem('gymv_data');
      if (local) { try { appData = JSON.parse(local); } catch(e) {} }
      
      if (isCloudReady) {
        onSnapshot(doc(db, "userdata", "main_profile"), (snapshot) => {
          if (snapshot.exists()) {
            const cloudData = snapshot.data();
            // Prevent Cloud from overwriting local storage if cloud is empty due to previous Firebase rules failure
            if(cloudData.history && cloudData.history.length >= (appData.history ? appData.history.length : 0)) {
               appData = cloudData;
               localStorage.setItem('gymv_data', JSON.stringify(appData));
               window.updateBwHeader();
               if(document.getElementById('workoutView').style.display !== 'none') window.renderExercises();
               else window.renderHistory();
            }
          }
        }, (error) => {
            console.error("Firebase read blocked:", error);
        });
      }
      window.updateBwHeader();
      window.renderExercises();
    }

    // THE CRITICAL FIX: Safe, verified saving
    window.saveData = async function() {
      localStorage.setItem('gymv_data', JSON.stringify(appData));
      
      if (isCloudReady && navigator.onLine) {
        document.getElementById('cloudStatus').innerText = 'SYNCING...';
        try {
          await setDoc(doc(db, "userdata", "main_profile"), appData);
          document.getElementById('cloudDot').className = 'dot live';
          document.getElementById('cloudStatus').innerText = 'CLOUD SAVED';
          setTimeout(updateNetworkStatus, 2000);
        } catch (error) {
          console.error("Firebase Blocked Save:", error);
          document.getElementById('cloudDot').className = 'dot err';
          document.getElementById('cloudStatus').innerText = 'PERMISSION DENIED';
          alert("Firebase blocked the save! You must go to Firebase Rules and set 'allow read, write: if true;' to fix this.");
        }
      }
    }

    window.adj = function(id, delta) { let el = document.getElementById(id); let val = parseFloat(el.value) || 0; val += delta; if(val < 0) val = 0; el.value = val; }
    window.switchTab = function(tab) { document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.remove('active')); if (tab === 'workout') { document.querySelector('.tabs .tab-btn:nth-child(1)').classList.add('active'); document.getElementById('workoutView').style.display = 'block'; document.getElementById('historyView').style.display = 'none'; window.renderExercises(); } else { document.querySelector('.tabs .tab-btn:nth-child(2)').classList.add('active'); document.getElementById('workoutView').style.display = 'none'; document.getElementById('historyView').style.display = 'block'; window.renderHistory(); } };
    window.setDay = function(day) { currentDay = day; tempDaySession = {}; document.getElementById('dayABtn').className = day === 'A' ? 'tab-btn active' : 'tab-btn'; document.getElementById('dayBBtn').className = day === 'B' ? 'tab-btn active' : 'tab-btn'; window.renderExercises(); };
    window.setFilter = function(filter) { currentFilter = filter; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); document.getElementById(filter === 'ALL' ? 'flt-all' : filter === 'Home' ? 'flt-home' : 'flt-gym').classList.add('active'); window.renderExercises(); };
    function calcVol(sets) { let v = 0; sets.forEach(s => { v += (s.reps * (s.kg > 0 ? s.kg : 1)); }); return v; }
    function getLastSets(exName) { for (let i = appData.history.length - 1; i >= 0; i--) { if (appData.history[i].exercises && appData.history[i].exercises[exName]) return appData.history[i].exercises[exName]; } return null; }

    window.renderExercises = function() {
      const list = currentDay === 'A' ? DAY_A_EXERCISES : DAY_B_EXERCISES;
      const container = document.getElementById('exercisesContainer');
      container.innerHTML = '';

      list.forEach((ex, exIdx) => {
        if(currentFilter !== 'ALL' && ex.loc !== currentFilter) return;
        
        const lastSets = getLastSets(ex.name);
        const setCount = lastSets ? lastSets.length : ex.sets;
        const card = document.createElement('div');
        card.className = `exercise-card ${tempDaySession[ex.name] ? 'saved' : ''}`;
        card.id = `card-${exIdx}`;

        let setsHtml = '';
        for (let s = 1; s <= setCount; s++) {
          let defR = lastSets && lastSets[s-1] ? lastSets[s-1].reps : ex.reps;
          let defK = lastSets && lastSets[s-1] ? lastSets[s-1].kg : ex.kg;
          setsHtml += `
            <div class="set-row" id="row-${exIdx}-${s}">
              <div class="set-label">S${s}</div>
              <div class="input-box">
                <span>REPS</span>
                <div class="num-ctrl">
                  <div class="btn" onclick="window.adj('reps-${exIdx}-${s}', -1)">-</div>
                  <input type="number" id="reps-${exIdx}-${s}" value="${defR}">
                  <div class="btn" onclick="window.adj('reps-${exIdx}-${s}', 1)">+</div>
                </div>
              </div>
              <div class="input-box">
                <span>KG</span>
                <div class="num-ctrl">
                  <div class="btn" onclick="window.adj('kg-${exIdx}-${s}', -2.5)">-</div>
                  <input type="number" step="0.5" id="kg-${exIdx}-${s}" value="${defK}">
                  <div class="btn" onclick="window.adj('kg-${exIdx}-${s}', 2.5)">+</div>
                </div>
              </div>
              <button type="button" class="check-btn" onclick="this.classList.toggle('done')">✓</button>
            </div>`;
        }

        let savedBtnHtml = tempDaySession[ex.name] ? `<button class="save-ex-btn saved">EXERCISE SAVED</button>` : `<button class="save-ex-btn" onclick="window.saveSingleExercise('${ex.name}', ${exIdx})">LOG EXERCISE</button>`;
        card.innerHTML = `<div class="ex-header"><div class="ex-name">${ex.name} <span id="badge-${exIdx}"></span></div><div class="loc-badge">${ex.loc}</div></div><div class="ex-target">${ex.target}</div><div id="sets-wrapper-${exIdx}">${setsHtml}</div><div class="set-actions-bar"><button class="add-rem-btn" onclick="window.addSet(${exIdx})">+ SET</button><button class="add-rem-btn" onclick="window.removeSet(${exIdx})">- SET</button></div>${savedBtnHtml}`;
        container.appendChild(card);
      });
    }

    window.addSet = function(exIdx) {
      let wrapper = document.getElementById(`sets-wrapper-${exIdx}`);
      let s = wrapper.children.length + 1;
      let prevReps = 10, prevKg = 0;
      if (s > 1) { prevReps = document.getElementById(`reps-${exIdx}-${s-1}`).value; prevKg = document.getElementById(`kg-${exIdx}-${s-1}`).value; }
      let html = `
        <div class="set-row" id="row-${exIdx}-${s}">
          <div class="set-label">S${s}</div>
          <div class="input-box">
            <span>REPS</span>
            <div class="num-ctrl"><div class="btn" onclick="window.adj('reps-${exIdx}-${s}', -1)">-</div><input type="number" id="reps-${exIdx}-${s}" value="${prevReps}"><div class="btn" onclick="window.adj('reps-${exIdx}-${s}', 1)">+</div></div>
          </div>
          <div class="input-box">
            <span>KG</span>
            <div class="num-ctrl"><div class="btn" onclick="window.adj('kg-${exIdx}-${s}', -2.5)">-</div><input type="number" step="0.5" id="kg-${exIdx}-${s}" value="${prevKg}"><div class="btn" onclick="window.adj('kg-${exIdx}-${s}', 2.5)">+</div></div>
          </div>
          <button type="button" class="check-btn" onclick="this.classList.toggle('done')">✓</button>
        </div>`;
      wrapper.insertAdjacentHTML('beforeend', html);
    }
    window.removeSet = function(exIdx) { let wrapper = document.getElementById(`sets-wrapper-${exIdx}`); if(wrapper.children.length > 1) wrapper.removeChild(wrapper.lastElementChild); }

    window.saveSingleExercise = function(exName, exIdx) {
      let wrapper = document.getElementById(`sets-wrapper-${exIdx}`), rows = wrapper.children.length, loggedSets = [];
      for (let s = 1; s <= rows; s++) {
        let r = document.getElementById(`reps-${exIdx}-${s}`), k = document.getElementById(`kg-${exIdx}-${s}`);
        if(r && k && Number(r.value) > 0) loggedSets.push({ set: s, reps: Number(r.value), kg: Number(k.value) || 0 });
      }
      if(loggedSets.length === 0) return alert("Enter reps to save.");
      
      tempDaySession[exName] = loggedSets;
      let curVol = calcVol(loggedSets), pastSets = getLastSets(exName), pastVol = pastSets ? calcVol(pastSets) : 0, badgeHtml = '';
      if(pastVol > 0) {
        let diff = ((curVol - pastVol) / pastVol) * 100, cls = diff >= 0 ? 'pct-pos' : 'pct-neg', sign = diff >= 0 ? '+' : '';
        badgeHtml = `<span class="pct-badge ${cls}">${sign}${diff.toFixed(1)}%</span>`;
      } else badgeHtml = `<span class="pct-badge pct-neu">NEW</span>`;
      
      document.getElementById(`badge-${exIdx}`).innerHTML = badgeHtml;
      document.getElementById(`card-${exIdx}`).classList.add('saved');
      const btn = document.querySelector(`#card-${exIdx} .save-ex-btn`);
      btn.className = "save-ex-btn saved"; btn.innerText = "EXERCISE SAVED";
    }

    window.saveDayAnalysis = function() {
      if(Object.keys(tempDaySession).length === 0) return alert("Log at least one exercise first.");
      let todayVol = 0, lastDayVol = 0;
      for(let key in tempDaySession) todayVol += calcVol(tempDaySession[key]);
      for (let i = appData.history.length - 1; i >= 0; i--) {
        if(appData.history[i].type === `Day ${currentDay}`) {
          for(let k in appData.history[i].exercises) lastDayVol += calcVol(appData.history[i].exercises[k]);
          break;
        }
      }
      let dayPctStr = "BASE SESSION", dayCls = "pct-pos";
      if(lastDayVol > 0) {
        let diff = ((todayVol - lastDayVol) / lastDayVol) * 100;
        dayCls = diff >= 0 ? "pct-pos" : "pct-neg"; dayPctStr = diff >= 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
      }
      document.getElementById('modalDayScore').className = `modal-day-score ${dayCls}`;
      document.getElementById('modalDayScore').innerText = dayPctStr;
      document.getElementById('progressModal').style.display = 'flex';
    }

    window.closeModal = async function() {
      const rawDate = document.getElementById('sessionDate').value;
      let displayDate = "Unknown Date";
      if(rawDate) { let [y, m, d] = rawDate.split('-'); displayDate = new Date(y, m-1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
      
      const workoutPayload = { date: displayDate, timestamp: Date.now(), type: `Day ${currentDay}`, exercises: tempDaySession };
      appData.history.push(workoutPayload);
      await window.saveData(); // Await the true save
      tempDaySession = {}; 
      document.getElementById('progressModal').style.display = 'none';
      window.switchTab('history');
    }

    window.logBodyWeight = async function() {
      const val = parseFloat(document.getElementById('bwInput').value), rawDate = document.getElementById('bwDate').value;
      if (!val || isNaN(val) || !rawDate) return alert("Enter weight and date.");
      let [y, m, d] = rawDate.split('-');
      let displayDate = new Date(y, m-1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      appData.bodyWeights.push({ date: displayDate, weight: val, timestamp: Date.now() });
      document.getElementById('bwInput').value = '';
      await window.saveData(); window.updateBwHeader();
    }
    
    window.updateBwHeader = function() {
      const d = document.getElementById('lastBwDisplay');
      if (appData.bodyWeights.length > 0) {
        let last = appData.bodyWeights[appData.bodyWeights.length - 1], pctHtml = '';
        if(appData.bodyWeights.length > 1) {
          let prev = appData.bodyWeights[appData.bodyWeights.length - 2], diff = ((last.weight - prev.weight) / prev.weight) * 100;
          let cls = diff > 0 ? 'pct-neg' : (diff < 0 ? 'pct-pos' : 'pct-neu'), sign = diff > 0 ? '+' : '';
          pctHtml = `<span class="bw-pct ${cls}">${sign}${diff.toFixed(1)}%</span>`;
        }
        d.innerHTML = `Last: ${last.weight} kg ${pctHtml}`;
      } else d.innerText = "Last: Not logged";
    }

    window.deleteWorkout = async function(ts) { if(confirm("Permanently delete this workout session?")) { appData.history = appData.history.filter(h => h.timestamp !== ts); await window.saveData(); window.renderHistory(); } }
    window.deleteWeight = async function(ts) { if(confirm("Permanently delete this body weight entry?")) { appData.bodyWeights = appData.bodyWeights.filter(b => b.timestamp !== ts); await window.saveData(); window.renderHistory(); window.updateBwHeader(); } }

    window.renderHistory = function() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';
      if(appData.history.length >= 30) {
        let latest30 = appData.history.slice(-30), prev30 = appData.history.slice(-60, -30), lVol = 0, pVol = 0;
        latest30.forEach(w => { for(let ex in w.exercises) lVol += calcVol(w.exercises[ex]); });
        prev30.forEach(w => { for(let ex in w.exercises) pVol += calcVol(w.exercises[ex]); });
        if(pVol > 0) {
          let diff = ((lVol - pVol) / pVol) * 100, mCls = diff >= 0 ? "pct-pos" : "pct-neg", mStr = diff >= 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
          container.innerHTML += `<div class="history-card" style="border-color:var(--ash); background:#151515;"><div class="hist-head" style="color:var(--white);"><span>30-DAY MONTHLY PERFORMANCE</span></div><div style="display:flex; align-items:center; gap:16px;"><div style="font-size:2rem; font-weight:800;" class="${mCls}">${mStr}</div><div style="font-size:0.75rem; color:var(--ash-light);">Total volume compared against your previous 30 workout days.</div></div></div>`;
        }
      }
      if (appData.bodyWeights.length > 0) {
        let bwHtml = `<div class="history-card"><div class="hist-head"><span>BODY WEIGHT LOG</span></div>`;
        appData.bodyWeights.slice().reverse().forEach(b => { bwHtml += `<div class="hist-entry"><span>${b.date} &nbsp; <strong>${b.weight} kg</strong></span><button class="delete-btn" onclick="window.deleteWeight(${b.timestamp})">X</button></div>`; });
        container.innerHTML += bwHtml + `</div>`;
      }
      appData.history.slice().reverse().forEach(h => {
        let card = document.createElement('div'), exHtml = '';
        card.className = 'history-card';
        for (let name in h.exercises) {
          let summary = h.exercises[name].map(s => `${s.kg}kg×${s.reps}`).join(' | ');
          exHtml += `<div class="hist-entry" style="display:block; margin-bottom: 6px;"><span style="color:var(--white); font-weight:700;">${name}</span><div style="font-size:0.75rem; color:var(--ash-light);">${summary}</div></div>`;
        }
        card.innerHTML = `<div class="hist-head"><span>${h.type} (${h.date})</span><button class="delete-btn" onclick="window.deleteWorkout(${h.timestamp})">X</button></div>${exHtml}`;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
