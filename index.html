<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GYM LOG</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #000000;
      --card: #0e0e0e;
      --border: #242424;
      --muted: #888888;
      --light: #d4d4d4;
      --white: #ffffff;
      --pos: #2ecc71;
      --neg: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--white);
      width: 100%;
      overflow-x: hidden;
    }

    body {
      padding: env(safe-area-inset-top, 16px) 14px env(safe-area-inset-bottom, 60px) 14px;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .sync-pill {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--card);
      padding: 5px 9px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.live { background: var(--pos); }
    .dot.err { background: var(--neg); }

    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 12px;
    }

    .nav-btn {
      padding: 11px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--white);
      color: var(--bg);
      border-color: var(--white);
    }

    .schedule-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      margin-bottom: 12px;
      font-size: 0.74rem;
    }

    .schedule-text {
      color: var(--light);
      font-weight: 700;
    }

    .date-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-family: monospace;
    }

    .day-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .day-btn {
      padding: 11px 6px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .day-btn .d-name {
      display: block;
      font-size: 0.84rem;
      font-weight: 900;
      letter-spacing: 0.6px;
    }

    .day-btn .d-sub {
      display: block;
      font-size: 0.62rem;
      font-weight: 700;
      margin-top: 2px;
      opacity: 0.75;
    }

    .day-btn.active {
      background: var(--white);
      color: var(--bg);
      border-color: var(--white);
    }

    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .score-label {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .score-sub {
      font-size: 0.74rem;
      color: var(--light);
      margin-top: 4px;
    }

    .score-big {
      font-size: 1.6rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .pct-pos { color: var(--pos); }
    .pct-neg { color: var(--neg); }
    .pct-neu { color: var(--muted); }

    .badge {
      font-size: 0.7rem;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge.pct-pos { background: rgba(46, 204, 113, 0.14); color: var(--pos); }
    .badge.pct-neg { background: rgba(231, 76, 60, 0.14); color: var(--neg); }
    .badge.pct-neu { background: rgba(136, 136, 136, 0.15); color: var(--light); }

    .ex-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px;
      margin-bottom: 12px;
    }

    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .ex-name {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--white);
    }

    .ex-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      padding-bottom: 9px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .set-row {
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .set-row.single {
      grid-template-columns: 28px 1fr;
    }

    .set-num {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--muted);
    }

    .field-wrap {
      display: flex;
      flex-direction: column;
    }

    .field-lbl {
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .stepper {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      height: 36px;
      overflow: hidden;
    }

    .step-btn {
      width: 34px;
      background: #171717;
      border: none;
      color: var(--light);
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .step-btn:active {
      background: var(--white);
      color: var(--bg);
    }

    .stepper input {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--white);
      text-align: center;
      font-size: 0.92rem;
      font-weight: 800;
      -moz-appearance: textfield;
    }

    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .set-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .mini-btn {
      flex: 1;
      padding: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      border-radius: 4px;
      cursor: pointer;
    }

    .save-btn {
      width: 100%;
      padding: 15px;
      background: var(--white);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin: 8px 0 18px;
    }

    .toast {
      display: none;
      text-align: center;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      background: #121212;
      border: 1px solid var(--white);
      color: var(--white);
    }

    .hist-filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .flt-btn {
      padding: 8px 4px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      border-radius: 5px;
      cursor: pointer;
    }

    .flt-btn.active {
      background: var(--white);
      color: var(--bg);
      border-color: var(--white);
    }

    .hist-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .hist-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .hist-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 900;
      background: var(--white);
      color: var(--bg);
      padding: 2px 7px;
      border-radius: 4px;
      margin-right: 6px;
    }

    .hist-date {
      font-size: 0.84rem;
      font-weight: 800;
    }

    .hist-body {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .hist-ex {
      margin-bottom: 9px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }

    .hist-ex:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .hist-ex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 5px;
    }

    .chip {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--light);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px 7px;
      border-radius: 4px;
    }

    .del-btn {
      background: transparent;
      border: 1px solid var(--neg);
      color: var(--neg);
      font-size: 0.64rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .backup-box {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .backup-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .outline-btn {
      padding: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--white);
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--light);
      border-radius: 10px;
      padding: 18px;
      width: 100%;
      max-width: 400px;
    }

    .modal h2 {
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .modal-score {
      font-size: 2.5rem;
      font-weight: 900;
      text-align: center;
      margin: 12px 0;
    }

    .modal-list {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      max-height: 240px;
      overflow-y: auto;
    }

    .modal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: var(--white);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <h1>GYM LOG</h1>
    <div class="sync-pill">
      <span class="dot" id="syncDot"></span>
      <span id="syncText">LOCAL</span>
    </div>
  </header>

  <div id="toast" class="toast"></div>

  <div class="nav-tabs">
    <button class="nav-btn active" id="tabToday" onclick="window.setTab('today')">TODAY</button>
    <button class="nav-btn" id="tabHistory" onclick="window.setTab('history')">HISTORY</button>
  </div>

  <!-- TODAY VIEW -->
  <div id="todayView">
    <div class="schedule-strip">
      <span class="schedule-text" id="scheduleNotice">Today</span>
      <input type="date" id="workoutDate" class="date-input" onchange="window.onDateChange(this.value)">
    </div>

    <div class="day-tabs">
      <button class="day-btn" id="btn-Push" onclick="window.selectWorkout('Push')">
        <span class="d-name">PUSH</span>
        <span class="d-sub">Sat, Tue</span>
      </button>
      <button class="day-btn" id="btn-Pull" onclick="window.selectWorkout('Pull')">
        <span class="d-name">PULL</span>
        <span class="d-sub">Sun, Wed</span>
      </button>
      <button class="day-btn" id="btn-Mix" onclick="window.selectWorkout('Mix')">
        <span class="d-name">MIX</span>
        <span class="d-sub">Thu</span>
      </button>
    </div>

    <div class="score-card">
      <div>
        <div class="score-label">TODAY VS LAST <span id="scoreTypeName">PUSH</span></div>
        <div class="score-sub" id="scoreSubText">No past Push log yet</div>
      </div>
      <div class="score-big pct-neu" id="livePct">BASE</div>
    </div>

    <div id="exerciseList"></div>

    <button class="save-btn" onclick="window.saveTodayWorkout()">SAVE TODAY'S WORKOUT</button>
  </div>

  <!-- HISTORY VIEW -->
  <div id="historyView" style="display:none;">
    <div class="hist-filters">
      <button class="flt-btn active" id="flt-ALL" onclick="window.setHistoryFilter('ALL')">ALL</button>
      <button class="flt-btn" id="flt-Push" onclick="window.setHistoryFilter('Push')">PUSH</button>
      <button class="flt-btn" id="flt-Pull" onclick="window.setHistoryFilter('Pull')">PULL</button>
      <button class="flt-btn" id="flt-Mix" onclick="window.setHistoryFilter('Mix')">MIX</button>
    </div>

    <div id="historyList"></div>

    <div class="backup-box">
      <div class="backup-row">
        <button class="outline-btn" onclick="window.downloadBackup()">DOWNLOAD BACKUP</button>
        <label class="outline-btn">
          IMPORT BACKUP
          <input type="file" accept=".json" style="display:none" onchange="window.importBackup(event)">
        </label>
      </div>
      <button class="del-btn" style="padding:10px;" onclick="window.wipeAllData()">RESET ALL DATA</button>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div class="modal-bg" id="resultModal" onclick="window.closeResultModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h2 id="modalTitle">WORKOUT SAVED</h2>
      <div class="modal-score" id="modalScore">+0.0%</div>
      <div class="modal-list" id="modalList"></div>
      <button class="modal-btn" onclick="window.closeResultModal()">DONE</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB5zoyx9_f41-e3oBWRoFj5Si2eM9v5uwE",
      authDomain: "gymv-4baac.firebaseapp.com",
      projectId: "gymv-4baac",
      storageBucket: "gymv-4baac.firebasestorage.app",
      messagingSenderId: "21885539570",
      appId: "1:21885539570:web:6480453fee2c5e5979ac6b",
      measurementId: "G-8NWPQN2E63"
    };

    const STORAGE_KEY = "gym_simple_v1";
    const CLOUD_DOC_ID = "gym_simple_v1";

    // Schedule: 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
    const SCHEDULE = {
      6: { day: "Sat", type: "Push" },
      0: { day: "Sun", type: "Pull" },
      1: { day: "Mon", type: "Rest", fallback: "Push" },
      2: { day: "Tue", type: "Push" },
      3: { day: "Wed", type: "Pull" },
      4: { day: "Thu", type: "Mix" },
      5: { day: "Fri", type: "Rest", fallback: "Push" }
    };

    const PLANS = {
      Push: [
        { id: "push_db_press", name: "Dumbbell Press", target: "5 × 8-10", mode: "weight_reps", sets: 5, reps: 8, kg: 10 },
        { id: "push_wide_knee", name: "Wide Knee Push-ups", target: "4 × to failure", mode: "reps_only", sets: 4, reps: 15 },
        { id: "push_lat_raise", name: "Lateral Raise", target: "5 × 12-15", mode: "weight_reps", sets: 5, reps: 12, kg: 2.5 },
        { id: "push_tri_push", name: "Triceps Pushdown", target: "4 × 10-12", mode: "weight_reps", sets: 4, reps: 10, kg: 15 }
      ],
      Pull: [
        { id: "pull_lat_down", name: "Lat Pulldown", target: "5 × 8-12", mode: "weight_reps", sets: 5, reps: 10, kg: 25 },
        { id: "pull_db_curl", name: "Dumbbell Curl", target: "4 × 10-12", mode: "weight_reps", sets: 4, reps: 10, kg: 5 },
        { id: "pull_forearm", name: "Forearm Curls (palms up)", target: "4 × 15", mode: "weight_reps", sets: 4, reps: 15, kg: 5 },
        { id: "pull_plank", name: "Plank", target: "4 × 40 sec", mode: "time_only", sets: 4, sec: 40 }
      ],
      Mix: [
        { id: "mix_db_press", name: "Dumbbell Press", target: "4 × 10", mode: "weight_reps", sets: 4, reps: 10, kg: 10 },
        { id: "mix_lat_down", name: "Lat Pulldown", target: "4 × 10", mode: "weight_reps", sets: 4, reps: 10, kg: 25 },
        { id: "mix_lat_raise", name: "Lateral Raise", target: "4 × 15", mode: "weight_reps", sets: 4, reps: 15, kg: 2.5 },
        { id: "mix_db_curl", name: "Dumbbell Curl", target: "3 × 12", mode: "weight_reps", sets: 3, reps: 12, kg: 5 },
        { id: "mix_tri_push", name: "Triceps Pushdown", target: "3 × 12", mode: "weight_reps", sets: 3, reps: 12, kg: 15 },
        { id: "mix_squat", name: "Squat", target: "4 × 12", mode: "weight_reps", sets: 4, reps: 12, kg: 0 },
        { id: "mix_leg_raise", name: "Leg Raises", target: "3 × 15", mode: "reps_only", sets: 3, reps: 15 }
      ]
    };

    let db = null;
    let cloudReady = false;
    let lastWriteAt = 0;

    let currentType = "Push";
    let histFilter = "ALL";
    let expandedId = null;

    let appData = {
      history: [],
      drafts: {},
      updatedAt: 0
    };

    function getTodayISO() {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split("T")[0];
    }

    function formatDateNice(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return new Date(y, m - 1, d).toLocaleDateString("en-US", {
        weekday: "short", month: "short", day: "numeric"
      });
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.innerText = msg;
      el.style.display = "block";
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.display = "none"; }, 3500);
    }

    function updateSyncUI(state) {
      const dot = document.getElementById("syncDot");
      const text = document.getElementById("syncText");
      if (state === "live") { dot.className = "dot live"; text.innerText = "SYNCED"; }
      else if (state === "saving") { dot.className = "dot live"; text.innerText = "SAVING..."; }
      else if (state === "err") { dot.className = "dot err"; text.innerText = "OFFLINE"; }
      else { dot.className = "dot"; text.innerText = "LOCAL"; }
    }

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      cloudReady = true;
      updateSyncUI(navigator.onLine ? "live" : "err");
    } catch (e) {
      updateSyncUI("err");
    }

    window.addEventListener("online", () => { updateSyncUI("live"); saveAll(false); });
    window.addEventListener("offline", () => updateSyncUI("err"));

    function calcVolume(sets, mode) {
      if (!Array.isArray(sets)) return 0;
      let total = 0;
      sets.forEach(s => {
        if (mode === "time_only") total += Number(s.sec) || 0;
        else if (mode === "reps_only") total += Number(s.reps) || 0;
        else {
          const reps = Number(s.reps) || 0;
          const kg = Number(s.kg) || 0;
          total += reps * (kg > 0 ? kg : 1);
        }
      });
      return total;
    }

    // Find the most recent saved workout of the same type BEFORE the currently selected date (or any previous saved session)
    function getPreviousSession(type, excludeDate) {
      const matches = appData.history
        .filter(h => h.type === type && h.rawDate !== excludeDate)
        .sort((a, b) => (a.rawDate > b.rawDate ? 1 : (a.rawDate < b.rawDate ? -1 : a.timestamp - b.timestamp)));
      return matches.length > 0 ? matches[matches.length - 1] : null;
    }

    function getDraftKey(dateISO, type) {
      return `${dateISO}_${type}`;
    }

    function ensureDraft(dateISO, type) {
      const key = getDraftKey(dateISO, type);
      if (appData.drafts[key]) return appData.drafts[key];

      // If this exact date + type was already saved, load it for easy editing
      const existing = appData.history.find(h => h.rawDate === dateISO && h.type === type);
      if (existing) {
        const clone = {};
        PLANS[type].forEach(ex => {
          if (existing.exercises[ex.id]) {
            clone[ex.id] = existing.exercises[ex.id].map(s => ({ ...s }));
          }
        });
        appData.drafts[key] = clone;
        return clone;
      }

      // Otherwise pre-fill from the last session of the same workout type
      const prev = getPreviousSession(type, dateISO);
      const draft = {};
      PLANS[type].forEach(ex => {
        const prevSets = prev && prev.exercises ? prev.exercises[ex.id] : null;
        if (Array.isArray(prevSets) && prevSets.length > 0) {
          draft[ex.id] = prevSets.map(s => ({ ...s }));
        } else {
          const arr = [];
          for (let i = 0; i < ex.sets; i++) {
            if (ex.mode === "time_only") arr.push({ sec: ex.sec });
            else if (ex.mode === "reps_only") arr.push({ reps: ex.reps });
            else arr.push({ reps: ex.reps, kg: ex.kg });
          }
          draft[ex.id] = arr;
        }
      });

      appData.drafts[key] = draft;
      return draft;
    }

    function formatPct(num) {
      if (num === null || isNaN(num)) return { text: "BASE", cls: "pct-neu" };
      const rounded = Number(num.toFixed(1));
      if (rounded > 0) return { text: `+${rounded.toFixed(1)}%`, cls: "pct-pos" };
      if (rounded < 0) return { text: `${rounded.toFixed(1)}%`, cls: "pct-neg" };
      return { text: "0.0%", cls: "pct-neu" };
    }

    function computeComparison(dateISO, type) {
      const draft = ensureDraft(dateISO, type);
      const prev = getPreviousSession(type, dateISO);
      const perEx = {};
      const validPcts = [];

      PLANS[type].forEach(ex => {
        const curSets = draft[ex.id] || [];
        const curVol = calcVolume(curSets, ex.mode);
        const prevSets = prev && prev.exercises ? prev.exercises[ex.id] : null;
        const prevVol = calcVolume(prevSets, ex.mode);

        if (prev && prevVol > 0 && curVol > 0) {
          const pct = ((curVol - prevVol) / prevVol) * 100;
          perEx[ex.id] = { pct, ...formatPct(pct), curVol, prevVol };
          validPcts.push(pct);
        } else if (curVol > 0) {
          perEx[ex.id] = { pct: null, text: "BASE", cls: "pct-neu", curVol, prevVol: 0 };
        } else {
          perEx[ex.id] = { pct: null, text: "SKIP", cls: "pct-neu", curVol: 0, prevVol };
        }
      });

      let overall = { pct: null, text: "BASE", cls: "pct-neu" };
      if (validPcts.length > 0) {
        const avg = validPcts.reduce((a, b) => a + b, 0) / validPcts.length;
        overall = { pct: avg, ...formatPct(avg) };
      }

      return { overall, perEx, prev };
    }

    function updateScheduleBanner(dateISO) {
      const [y, m, d] = dateISO.split("-");
      const dow = new Date(y, m - 1, d).getDay();
      const info = SCHEDULE[dow];
      const el = document.getElementById("scheduleNotice");
      if (info.type === "Rest") {
        el.innerText = `${info.day}: Rest Day (still log if you trained)`;
      } else {
        el.innerText = `${info.day}: Scheduled ${info.type}`;
      }
    }

    function renderWorkout() {
      const dateISO = document.getElementById("workoutDate").value || getTodayISO();
      updateScheduleBanner(dateISO);

      ["Push", "Pull", "Mix"].forEach(t => {
        document.getElementById(`btn-${t}`).classList.toggle("active", t === currentType);
      });

      const draft = ensureDraft(dateISO, currentType);
      const comp = computeComparison(dateISO, currentType);

      document.getElementById("scoreTypeName").innerText = currentType.toUpperCase();
      const scoreEl = document.getElementById("livePct");
      scoreEl.innerText = comp.overall.text;
      scoreEl.className = `score-big ${comp.overall.cls}`;

      const subEl = document.getElementById("scoreSubText");
      if (comp.prev) {
        subEl.innerText = `Compared to ${formatDateNice(comp.prev.rawDate)}`;
      } else {
        subEl.innerText = `First ${currentType} workout (sets your baseline)`;
      }

      const container = document.getElementById("exerciseList");
      container.innerHTML = "";

      PLANS[currentType].forEach(ex => {
        const sets = draft[ex.id] || [];
        const exComp = comp.perEx[ex.id];
        const prevSets = comp.prev && comp.prev.exercises ? comp.prev.exercises[ex.id] : null;

        let prevSummary = "No past log";
        if (Array.isArray(prevSets) && prevSets.length > 0) {
          prevSummary = "Last: " + prevSets.map(s => formatOneSet(s, ex.mode)).join(", ");
        }

        let rowsHtml = "";
        sets.forEach((s, i) => {
          if (ex.mode === "time_only") {
            rowsHtml += `
              <div class="set-row single">
                <div class="set-num">S${i + 1}</div>
                <div class="field-wrap">
                  <div class="field-lbl">Seconds</div>
                  <div class="stepper">
                    <button class="step-btn" onclick="window.stepVal('${ex.id}', ${i}, 'sec', -5)">-</button>
                    <input type="number" value="${s.sec ?? 0}" oninput="window.setVal('${ex.id}', ${i}, 'sec', this.value)">
                    <button class="step-btn" onclick="window.stepVal('${ex.id}', ${i}, 'sec', 5)">+</button>
                  </div>
                </div>
              </div>`;
          } else if (ex.mode === "reps_only") {
            rowsHtml += `
              <div class="set-row single">
                <div class="set-num">S${i + 1}</div>
                <div class="field-wrap">
                  <div class="field-lbl">Reps</div>
                  <div class="stepper">
                    <button class="step-btn" onclick="window.stepVal('${ex.id}', ${i}, 'reps', -1)">-</button>
                    <input type="number" value="${s.reps ?? 0}" oninput="window.setVal('${ex.id}', ${i}, 'reps', this.value)">
                    <button class="step-btn" onclick="window.stepVal('${ex.id}', ${i}, 'reps', 1)">+</button>
                  </div>
                </div>
              </div>`;
          } else {
            rowsHtml += `
              <div class="set-row">
                <div class="set-num">S${i + 1}</div>
                <div class="field-wrap">
                  <div class="field-lbl">Reps</div>
                  <div class="stepper">
                    <button class="step-btn" onclick="window.stepVal('${ex.id}', ${i}, 'reps', -1)">-</button>
                    <input type="number" value="${s.reps ?? 0}" oninput="window.setVal('${ex.id}', ${i}, 'reps', this.value)">
                    <button class="step-btn" onclick="window.stepVal('${ex.id}', ${i}, 'reps', 1)">+</button>
                  </div>
                </div>
                <div class="field-wrap">
                  <div class="field-lbl">KG</div>
                  <div class="stepper">
                    <button class="step-btn" onclick="window.stepVal('${ex.id}', ${i}, 'kg', -2.5)">-</button>
                    <input type="number" step="0.5" value="${s.kg ?? 0}" oninput="window.setVal('${ex.id}', ${i}, 'kg', this.value)">
                    <button class="step-btn" onclick="window.stepVal('${ex.id}', ${i}, 'kg', 2.5)">+</button>
                  </div>
                </div>
              </div>`;
          }
        });

        const card = document.createElement("div");
        card.className = "ex-card";
        card.innerHTML = `
          <div class="ex-top">
            <div class="ex-name">${ex.name}</div>
            <span class="badge ${exComp.cls}" id="exBadge-${ex.id}">${exComp.text}</span>
          </div>
          <div class="ex-meta">
            <span>Target: ${ex.target}</span>
            <span style="text-align:right; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${prevSummary}</span>
          </div>
          ${rowsHtml}
          <div class="set-btns">
            <button class="mini-btn" onclick="window.removeSet('${ex.id}')">- SET</button>
            <button class="mini-btn" onclick="window.addSet('${ex.id}')">+ SET</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function refreshLiveBadgesOnly() {
      const dateISO = document.getElementById("workoutDate").value || getTodayISO();
      const comp = computeComparison(dateISO, currentType);
      const scoreEl = document.getElementById("livePct");
      scoreEl.innerText = comp.overall.text;
      scoreEl.className = `score-big ${comp.overall.cls}`;

      PLANS[currentType].forEach(ex => {
        const b = document.getElementById(`exBadge-${ex.id}`);
        if (b && comp.perEx[ex.id]) {
          b.innerText = comp.perEx[ex.id].text;
          b.className = `badge ${comp.perEx[ex.id].cls}`;
        }
      });
    }

    function formatOneSet(s, mode) {
      if (mode === "time_only") return `${s.sec}s`;
      if (mode === "reps_only") return `${s.reps}r`;
      return s.kg > 0 ? `${s.kg}kg×${s.reps}` : `${s.reps}r`;
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    async function saveAll(showStatus = true) {
      appData.updatedAt = Date.now();
      lastWriteAt = appData.updatedAt;
      saveLocal();
      if (cloudReady && navigator.onLine) {
        if (showStatus) updateSyncUI("saving");
        try {
          await setDoc(doc(db, "userdata", CLOUD_DOC_ID), appData);
          updateSyncUI("live");
        } catch (e) {
          updateSyncUI("err");
        }
      }
    }

    window.setVal = function(exId, idx, field, raw) {
      const dateISO = document.getElementById("workoutDate").value || getTodayISO();
      const draft = ensureDraft(dateISO, currentType);
      let v = parseFloat(raw);
      if (isNaN(v) || v < 0) v = 0;
      draft[exId][idx][field] = v;
      saveLocal();
      refreshLiveBadgesOnly();
    };

    window.stepVal = function(exId, idx, field, delta) {
      const dateISO = document.getElementById("workoutDate").value || getTodayISO();
      const draft = ensureDraft(dateISO, currentType);
      let v = Number(draft[exId][idx][field] || 0) + delta;
      v = Math.max(0, Number(v.toFixed(1)));
      draft[exId][idx][field] = v;
      saveLocal();
      renderWorkout();
    };

    window.addSet = function(exId) {
      const dateISO = document.getElementById("workoutDate").value || getTodayISO();
      const draft = ensureDraft(dateISO, currentType);
      const ex = PLANS[currentType].find(e => e.id === exId);
      const arr = draft[exId];
      const last = arr[arr.length - 1];
      if (last) arr.push({ ...last });
      else if (ex.mode === "time_only") arr.push({ sec: ex.sec });
      else if (ex.mode === "reps_only") arr.push({ reps: ex.reps });
      else arr.push({ reps: ex.reps, kg: ex.kg });
      saveLocal();
      renderWorkout();
    };

    window.removeSet = function(exId) {
      const dateISO = document.getElementById("workoutDate").value || getTodayISO();
      const draft = ensureDraft(dateISO, currentType);
      if (draft[exId].length <= 1) return;
      draft[exId].pop();
      saveLocal();
      renderWorkout();
    };

    window.selectWorkout = function(type) {
      currentType = type;
      renderWorkout();
    };

    window.onDateChange = function(val) {
      if (!val) return;
      const [y, m, d] = val.split("-");
      const info = SCHEDULE[new Date(y, m - 1, d).getDay()];
      if (info.type !== "Rest") currentType = info.type;
      renderWorkout();
    };

    window.saveTodayWorkout = async function() {
      const dateISO = document.getElementById("workoutDate").value || getTodayISO();
      const draft = ensureDraft(dateISO, currentType);
      const comp = computeComparison(dateISO, currentType);

      const cleanExercises = {};
      const cleanPerEx = {};
      let savedCount = 0;

      PLANS[currentType].forEach(ex => {
        const sets = (draft[ex.id] || []).filter(s => {
          if (ex.mode === "time_only") return (Number(s.sec) || 0) > 0;
          return (Number(s.reps) || 0) > 0;
        });
        if (sets.length > 0) {
          cleanExercises[ex.id] = sets;
          cleanPerEx[ex.id] = {
            name: ex.name,
            mode: ex.mode,
            text: comp.perEx[ex.id].text,
            cls: comp.perEx[ex.id].cls
          };
          savedCount++;
        }
      });

      if (savedCount === 0) {
        showToast("Enter at least one exercise before saving.");
        return;
      }

      const entry = {
        id: `${dateISO}_${currentType}`,
        rawDate: dateISO,
        type: currentType,
        timestamp: Date.now(),
        scoreText: comp.overall.text,
        scoreCls: comp.overall.cls,
        comparedTo: comp.prev ? comp.prev.rawDate : null,
        exercises: cleanExercises,
        meta: cleanPerEx
      };

      // Replace if already saved for this exact date + workout type
      const idx = appData.history.findIndex(h => h.rawDate === dateISO && h.type === currentType);
      if (idx >= 0) appData.history[idx] = entry;
      else appData.history.push(entry);

      await saveAll(true);

      // Show clean daily result modal
      document.getElementById("modalTitle").innerText = `${currentType.toUpperCase()} SAVED • ${formatDateNice(dateISO)}`;
      const mScore = document.getElementById("modalScore");
      mScore.innerText = entry.scoreText;
      mScore.className = `modal-score ${entry.scoreCls}`;

      let listHtml = "";
      PLANS[currentType].forEach(ex => {
        if (cleanPerEx[ex.id]) {
          listHtml += `
            <div class="modal-row">
              <span>${ex.name}</span>
              <span class="badge ${cleanPerEx[ex.id].cls}">${cleanPerEx[ex.id].text}</span>
            </div>`;
        }
      });
      document.getElementById("modalList").innerHTML = listHtml;
      document.getElementById("resultModal").style.display = "flex";
    };

    window.closeResultModal = function() {
      document.getElementById("resultModal").style.display = "none";
      renderWorkout();
    };

    window.setTab = function(tab) {
      document.getElementById("tabToday").classList.toggle("active", tab === "today");
      document.getElementById("tabHistory").classList.toggle("active", tab === "history");
      document.getElementById("todayView").style.display = tab === "today" ? "block" : "none";
      document.getElementById("historyView").style.display = tab === "history" ? "block" : "none";
      if (tab === "history") renderHistory();
      else renderWorkout();
    };

    window.setHistoryFilter = function(flt) {
      histFilter = flt;
      ["ALL", "Push", "Pull", "Mix"].forEach(k => {
        document.getElementById(`flt-${k}`).classList.toggle("active", k === flt);
      });
      renderHistory();
    };

    window.toggleHist = function(id) {
      expandedId = expandedId === id ? null : id;
      renderHistory();
    };

    window.deleteLog = async function(id) {
      if (!confirm("Delete this saved workout?")) return;
      appData.history = appData.history.filter(h => h.id !== id);
      await saveAll(true);
      renderHistory();
      showToast("Workout deleted.");
    };

    function renderHistory() {
      const list = document.getElementById("historyList");
      const items = appData.history
        .slice()
        .filter(h => histFilter === "ALL" || h.type === histFilter)
        .sort((a, b) => (b.rawDate > a.rawDate ? 1 : (b.rawDate < a.rawDate ? -1 : b.timestamp - a.timestamp)));

      if (items.length === 0) {
        list.innerHTML = `<div class="hist-card" style="text-align:center; color:var(--muted); font-size:0.8rem;">No workouts saved yet.</div>`;
        return;
      }

      list.innerHTML = "";
      items.forEach((h, i) => {
        const isOpen = expandedId === h.id || (expandedId === null && i === 0);
        let exHtml = "";
        const plan = PLANS[h.type] || [];
        plan.forEach(ex => {
          const sets = h.exercises[ex.id];
          if (!sets) return;
          const m = (h.meta && h.meta[ex.id]) || { text: "BASE", cls: "pct-neu" };
          const chips = sets.map((s, idx) => `<span class="chip">S${idx + 1}: ${formatOneSet(s, ex.mode)}</span>`).join("");
          exHtml += `
            <div class="hist-ex">
              <div class="hist-ex-row">
                <span>${ex.name}</span>
                <span class="badge ${m.cls}">${m.text}</span>
              </div>
              <div class="chips">${chips}</div>
            </div>`;
        });

        const compText = h.comparedTo ? `vs ${formatDateNice(h.comparedTo)}` : "Baseline";
        const card = document.createElement("div");
        card.className = "hist-card";
        card.innerHTML = `
          <div class="hist-top" onclick="window.toggleHist('${h.id}')">
            <div>
              <div>
                <span class="hist-tag">${h.type.toUpperCase()}</span>
                <span class="hist-date">${formatDateNice(h.rawDate)}</span>
              </div>
              <div style="font-size:0.68rem; color:var(--muted); margin-top:4px;">${compText}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge ${h.scoreCls}">${h.scoreText}</span>
              <button class="del-btn" onclick="event.stopPropagation(); window.deleteLog('${h.id}')">DEL</button>
            </div>
          </div>
          ${isOpen ? `<div class="hist-body">${exHtml}</div>` : ""}
        `;
        list.appendChild(card);
      });
    }

    window.downloadBackup = function() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `gym-log-${getTodayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.importBackup = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!Array.isArray(parsed.history)) throw new Error();
          appData = {
            history: parsed.history,
            drafts: parsed.drafts || {},
            updatedAt: Date.now()
          };
          await saveAll(true);
          renderHistory();
          showToast("Backup imported.");
        } catch {
          showToast("Invalid backup file.");
        }
      };
      reader.readAsText(file);
    };

    window.wipeAllData = async function() {
      if (!confirm("Delete ALL saved workouts from phone and cloud?")) return;
      appData = { history: [], drafts: {}, updatedAt: Date.now() };
      await saveAll(true);
      renderHistory();
      showToast("All data reset.");
    };

    function init() {
      const todayISO = getTodayISO();
      document.getElementById("workoutDate").value = todayISO;

      const dow = new Date().getDay();
      const info = SCHEDULE[dow];
      currentType = info.type === "Rest" ? info.fallback : info.type;

      const local = localStorage.getItem(STORAGE_KEY);
      if (local) {
        try {
          const parsed = JSON.parse(local);
          if (parsed && Array.isArray(parsed.history)) {
            appData = { history: parsed.history, drafts: parsed.drafts || {}, updatedAt: parsed.updatedAt || 0 };
          }
        } catch {}
      }

      renderWorkout();

      if (cloudReady) {
        onSnapshot(doc(db, "userdata", CLOUD_DOC_ID), (snap) => {
          if (!snap.exists()) return;
          if (Date.now() - lastWriteAt < 2500) return;
          const remote = snap.data();
          if ((remote.updatedAt || 0) > (appData.updatedAt || 0)) {
            appData = {
              history: Array.isArray(remote.history) ? remote.history : [],
              drafts: remote.drafts || {},
              updatedAt: remote.updatedAt || 0
            };
            saveLocal();
            if (document.getElementById("historyView").style.display === "block") renderHistory();
            else renderWorkout();
          }
        });
      }
    }

    init();
  </script>
</body>
</html>
