<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GYM.V</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #050505;
      --card: #111111;
      --card-border: #222222;
      --ash: #888888;
      --ash-light: #d1d1d1;
      --white: #f5f5f5;
      --accent: #333333;
      --pos: #2ecc71;
      --neg: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--white);
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 80px) 16px;
      min-height: 100vh;
    }

    header {
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--white);
      font-weight: 800;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--ash);
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 4px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ash);
    }
    .dot.live { background: var(--pos); }
    .dot.err { background: var(--neg); }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--ash);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .tab-btn.active {
      color: var(--white);
      border-color: var(--ash);
      background: #1c1c1c;
    }

    .bw-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .bw-card label {
      font-size: 0.8rem;
      color: var(--ash-light);
      text-transform: uppercase;
      font-weight: 700;
    }

    .bw-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bw-input-wrap input {
      width: 75px;
      background: #000;
      border: 1px solid var(--card-border);
      color: var(--white);
      padding: 10px;
      font-size: 0.95rem;
      border-radius: 4px;
      text-align: center;
    }

    .bw-btn {
      background: var(--white);
      color: #000;
      padding: 10px 14px;
      font-size: 0.8rem;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .exercise-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .ex-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
    }

    .ex-target {
      font-size: 0.75rem;
      color: var(--ash-light);
      margin-bottom: 8px;
    }

    .ex-duration {
      font-size: 0.75rem;
      color: var(--ash);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 50px 1fr 1fr 40px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .set-label {
      font-size: 0.75rem;
      color: var(--ash);
      font-weight: 700;
    }

    .input-box {
      display: flex;
      flex-direction: column;
    }

    .input-box span {
      font-size: 0.65rem;
      color: var(--ash);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .input-box input {
      background: #000;
      border: 1px solid var(--card-border);
      color: var(--white);
      padding: 10px;
      font-size: 0.95rem;
      border-radius: 4px;
      text-align: center;
    }

    .check-btn {
      height: 40px;
      background: #181818;
      border: 1px solid var(--card-border);
      color: var(--ash);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }

    .check-btn.done {
      background: var(--white);
      color: #000;
      font-weight: 800;
    }

    .set-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .set-action-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.75rem;
      background: #181818;
      border: 1px solid var(--card-border);
      color: var(--ash);
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .save-session-btn {
      width: 100%;
      padding: 16px;
      margin: 24px 0 40px;
      background: var(--white);
      color: #000;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .history-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .hist-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--ash);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      font-weight: 700;
    }

    .hist-entry {
      font-size: 0.85rem;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hist-entry span {
      color: var(--ash-light);
    }
    
    .pct-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      margin-left: 8px;
    }
    .pct-pos { color: var(--pos); }
    .pct-neg { color: var(--neg); }
    .pct-neu { color: var(--ash); }
    
    .bg-pos { background: rgba(46, 204, 113, 0.15); }
    .bg-neg { background: rgba(231, 76, 60, 0.15); }
    .bg-neu { background: rgba(136, 136, 136, 0.15); }

    /* Modal for Progress Report */
    #progressModal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 20px;
    }

    .modal-content h2 {
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 16px;
      color: var(--white);
    }

    #modalReportList {
      max-height: 60vh;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .report-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.85rem;
    }

    .close-modal-btn {
      width: 100%;
      padding: 14px;
      background: var(--white);
      color: #000;
      font-weight: 800;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>GYM.V</h1>
    <div class="status-badge">
      <span class="dot" id="cloudDot"></span>
      <span id="cloudStatus">CONNECTING...</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="window.switchTab('workout')">WORKOUT</button>
    <button class="tab-btn" onclick="window.switchTab('history')">HISTORY</button>
  </div>

  <div class="bw-card">
    <div>
      <label>Body Weight</label>
      <div style="font-size: 0.75rem; color: var(--ash); margin-top:4px;" id="lastBwDisplay">Last: Not logged</div>
    </div>
    <div class="bw-input-wrap">
      <input type="number" step="0.1" id="bwInput" placeholder="kg">
      <button class="bw-btn" onclick="window.logBodyWeight()">LOG</button>
    </div>
  </div>

  <div id="workoutView">
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <button class="tab-btn active" id="dayABtn" onclick="window.setDay('A')">DAY A (PUSH)</button>
      <button class="tab-btn" id="dayBBtn" onclick="window.setDay('B')">DAY B (PULL)</button>
    </div>
    <div id="exercisesContainer"></div>
    <button class="save-session-btn" onclick="window.saveCurrentWorkout()">SAVE & ANALYZE</button>
  </div>

  <div id="historyView" style="display: none;">
    <div id="historyList"></div>
  </div>

  <!-- Progress Report Modal -->
  <div id="progressModal">
    <div class="modal-content">
      <h2>SESSION PROGRESS</h2>
      <div id="modalReportList"></div>
      <button class="close-modal-btn" onclick="window.closeModal()">CONFIRM SAVED</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. EXACT FIREBASE CONFIGURATION PROVIDED
    const firebaseConfig = {
      apiKey: "AIzaSyB5zoyx9_f41-e3oBWRoFj5Si2eM9v5uwE",
      authDomain: "gymv-4baac.firebaseapp.com",
      projectId: "gymv-4baac",
      storageBucket: "gymv-4baac.firebasestorage.app",
      messagingSenderId: "21885539570",
      appId: "1:21885539570:web:6480453fee2c5e5979ac6b",
      measurementId: "G-8NWPQN2E63"
    };

    let app, db;
    let isCloudReady = false;

    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      isCloudReady = true;
      document.getElementById('cloudDot').className = 'dot live';
      document.getElementById('cloudStatus').innerText = 'CLOUD SYNCED';
    } catch (e) {
      document.getElementById('cloudDot').className = 'dot err';
      document.getElementById('cloudStatus').innerText = 'OFFLINE MODE';
    }

    const DAY_A_EXERCISES = [
      { name: "Neck Curls", target: "Front Neck Thickness", defaultSets: 3, defaultReps: 15, defaultKg: 0 },
      { name: "Push-ups", target: "Chest & Triceps", defaultSets: 3, defaultReps: 15, defaultKg: 0 },
      { name: "Pike Push-ups", target: "Front/Side Shoulders", defaultSets: 3, defaultReps: 10, defaultKg: 0 },
      { name: "Crunches", target: "Upper/Mid Abs", defaultSets: 3, defaultReps: 20, defaultKg: 0 },
      { name: "Stomach Vacuums", target: "Transversus Abdominis", defaultSets: 3, defaultReps: 30, defaultKg: 0 },
      { name: "Parallel Bar Dips", target: "Lower Chest Line", defaultSets: 3, defaultReps: 8, defaultKg: 0 },
      { name: "Decline Bench Press", target: "Upper Chest Fullness", defaultSets: 3, defaultReps: 10, defaultKg: 20 },
      { name: "Standing Barbell Press", target: "Overall Shoulder Mass", defaultSets: 3, defaultReps: 8, defaultKg: 15 },
      { name: "Front Raises", target: "Front Deltoids", defaultSets: 3, defaultReps: 12, defaultKg: 5 },
      { name: "Standing Dumbbell Fly", target: "Side Shoulders (Width)", defaultSets: 3, defaultReps: 12, defaultKg: 5 },
      { name: "Tricep Overhead Ext", target: "Long Head Triceps", defaultSets: 3, defaultReps: 10, defaultKg: 7.5 },
      { name: "One Arm Triceps Overhead", target: "Tricep Symmetry", defaultSets: 3, defaultReps: 10, defaultKg: 5 }
    ];

    const DAY_B_EXERCISES = [
      { name: "Neck Extensions", target: "Back Neck & Traps", defaultSets: 3, defaultReps: 15, defaultKg: 0 },
      { name: "Free Squats", target: "Quads & Glutes (Posture)", defaultSets: 3, defaultReps: 30, defaultKg: 0 },
      { name: "Glute Bridges", target: "Glutes (Pelvic Tilt)", defaultSets: 3, defaultReps: 15, defaultKg: 0 },
      { name: "Superman Holds", target: "Lower Back Stability", defaultSets: 3, defaultReps: 30, defaultKg: 0 },
      { name: "Dead Hangs", target: "Grip & Lat Stretch", defaultSets: 3, defaultReps: 10, defaultKg: 0 },
      { name: "Lat Pulldown", target: "Lats & Upper Back Width", defaultSets: 3, defaultReps: 10, defaultKg: 25 },
      { name: "Back Fly", target: "Rear Delts", defaultSets: 3, defaultReps: 12, defaultKg: 5 },
      { name: "Pullovers", target: "Ribcage Expansion & Lats", defaultSets: 3, defaultReps: 10, defaultKg: 10 },
      { name: "Barbell Curl", target: "Bicep Mass", defaultSets: 3, defaultReps: 10, defaultKg: 15 },
      { name: "Dumbbell Curl", target: "Bicep Symmetry", defaultSets: 3, defaultReps: 10, defaultKg: 7.5 },
      { name: "Reverse Curl", target: "Brachialis & Forearms", defaultSets: 3, defaultReps: 12, defaultKg: 10 },
      { name: "Forearms (Wrist Curls)", target: "Forearm Thickness", defaultSets: 3, defaultReps: 15, defaultKg: 10 }
    ];

    let currentDay = 'A';
    let appData = { history: [], bodyWeights: [] };

    function loadData() {
      const local = localStorage.getItem('gymv_data');
      if (local) {
        try { appData = JSON.parse(local); } catch(e) {}
      }
      if (isCloudReady) {
        onSnapshot(doc(db, "userdata", "main_profile"), (snapshot) => {
          if (snapshot.exists()) {
            appData = snapshot.data();
            localStorage.setItem('gymv_data', JSON.stringify(appData));
            window.updateBwHeader();
            if(document.getElementById('workoutView').style.display !== 'none') {
               window.renderExercises();
            } else {
               window.renderHistory();
            }
          }
        });
      }
      window.updateBwHeader();
      window.renderExercises();
    }

    function saveData() {
      localStorage.setItem('gymv_data', JSON.stringify(appData));
      if (isCloudReady) {
        setDoc(doc(db, "userdata", "main_profile"), appData).catch(err => console.log("Cloud sync delayed"));
      }
    }

    window.switchTab = function(tab) {
      document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'workout') {
        document.querySelector('.tabs .tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('workoutView').style.display = 'block';
        document.getElementById('historyView').style.display = 'none';
      } else {
        document.querySelector('.tabs .tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('workoutView').style.display = 'none';
        document.getElementById('historyView').style.display = 'block';
        window.renderHistory();
      }
    };

    window.setDay = function(day) {
      currentDay = day;
      document.getElementById('dayABtn').className = day === 'A' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('dayBBtn').className = day === 'B' ? 'tab-btn active' : 'tab-btn';
      window.renderExercises();
    };

    // Calculate total volume for an exercise (Reps * Weight)
    function calculateVolume(sets) {
      let vol = 0;
      sets.forEach(s => {
        let w = s.kg > 0 ? s.kg : 1; 
        vol += (s.reps * w);
      });
      return vol;
    }

    function getStreakAndPastVolume(exerciseName) {
      let streak = 0;
      let lastWeight = null;
      let pastVolume = 0;

      for (let i = appData.history.length - 1; i >= 0; i--) {
        const entry = appData.history[i];
        if (entry.exercises && entry.exercises[exerciseName]) {
          const sets = entry.exercises[exerciseName];
          
          if (streak === 0) {
            pastVolume = calculateVolume(sets);
          }

          const topWeight = Math.max(...sets.map(s => Number(s.kg) || 0));
          if (lastWeight === null) {
            lastWeight = topWeight;
            streak = 1;
          } else if (lastWeight === topWeight) {
            streak++;
          } else {
            break;
          }
        }
      }
      return { streak, lastWeight: lastWeight !== null ? lastWeight : 0, pastVolume };
    }

    function getLastSets(exerciseName) {
      for (let i = appData.history.length - 1; i >= 0; i--) {
        const entry = appData.history[i];
        if (entry.exercises && entry.exercises[exerciseName]) {
          return entry.exercises[exerciseName];
        }
      }
      return null;
    }

    window.renderExercises = function() {
      const list = currentDay === 'A' ? DAY_A_EXERCISES : DAY_B_EXERCISES;
      const container = document.getElementById('exercisesContainer');
      container.innerHTML = '';

      list.forEach((ex, exIdx) => {
        const { streak, lastWeight } = getStreakAndPastVolume(ex.name);
        const lastSets = getLastSets(ex.name);
        const card = document.createElement('div');
        card.className = 'exercise-card';

        let streakText = streak > 0 ? `Using ${lastWeight} kg for last ${streak} workout${streak > 1 ? 's' : ''}` : `New training block`;
        let setsHtml = '';
        const setCount = lastSets ? lastSets.length : ex.defaultSets;

        for (let s = 1; s <= setCount; s++) {
          const defaultK = lastSets && lastSets[s - 1] ? lastSets[s - 1].kg : ex.defaultKg;
          const defaultR = lastSets && lastSets[s - 1] ? lastSets[s - 1].reps : ex.defaultReps;
          setsHtml += `
            <div class="set-row">
              <div class="set-label">SET ${s}</div>
              <div class="input-box">
                <span>REPS</span>
                <input type="number" id="reps-${exIdx}-${s}" value="${defaultR}">
              </div>
              <div class="input-box">
                <span>KG</span>
                <input type="number" step="0.5" id="kg-${exIdx}-${s}" value="${defaultK}">
              </div>
              <button type="button" class="check-btn" onclick="this.classList.toggle('done')">✓</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="ex-header"><div class="ex-name">${ex.name}</div></div>
          <div class="ex-target">${ex.target}</div>
          <div class="ex-duration"><span>${streakText}</span></div>
          <div id="sets-wrapper-${exIdx}">${setsHtml}</div>
          <div class="set-actions">
            <button type="button" class="set-action-btn" onclick="window.addSet(${exIdx})">+ ADD SET</button>
            <button type="button" class="set-action-btn" onclick="window.removeSet(${exIdx})">- REMOVE SET</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.addSet = function(exIdx) {
      const wrapper = document.getElementById(`sets-wrapper-${exIdx}`);
      const count = wrapper.children.length + 1;
      const row = document.createElement('div');
      row.className = 'set-row';
      row.innerHTML = `
        <div class="set-label">SET ${count}</div>
        <div class="input-box"><span>REPS</span><input type="number" id="reps-${exIdx}-${count}" value="10"></div>
        <div class="input-box"><span>KG</span><input type="number" step="0.5" id="kg-${exIdx}-${count}" value="0"></div>
        <button type="button" class="check-btn" onclick="this.classList.toggle('done')">✓</button>
      `;
      wrapper.appendChild(row);
    }

    window.removeSet = function(exIdx) {
      const wrapper = document.getElementById(`sets-wrapper-${exIdx}`);
      if (wrapper.children.length > 1) {
        wrapper.removeChild(wrapper.lastChild);
      }
    }

    window.saveCurrentWorkout = function() {
      const list = currentDay === 'A' ? DAY_A_EXERCISES : DAY_B_EXERCISES;
      
      const workoutPayload = {
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        timestamp: Date.now(),
        type: `Day ${currentDay}`,
        exercises: {},
        progress: {}
      };

      let reportHtml = '';

      list.forEach((ex, exIdx) => {
        const wrapper = document.getElementById(`sets-wrapper-${exIdx}`);
        const rows = wrapper.children;
        const loggedSets = [];
        for (let s = 1; s <= rows.length; s++) {
          const r = document.getElementById(`reps-${exIdx}-${s}`);
          const k = document.getElementById(`kg-${exIdx}-${s}`);
          if (r && k && Number(r.value) > 0) {
            loggedSets.push({ set: s, reps: Number(r.value), kg: Number(k.value) || 0 });
          }
        }
        
        if (loggedSets.length > 0) {
          workoutPayload.exercises[ex.name] = loggedSets;
          
          const currentVol = calculateVolume(loggedSets);
          const { pastVolume } = getStreakAndPastVolume(ex.name);
          
          let pctStr = "NEW";
          let pctClass = "pct-neu bg-neu";
          
          if (pastVolume > 0) {
            const pctChange = ((currentVol - pastVolume) / pastVolume) * 100;
            if (pctChange > 0) {
              pctStr = `+${pctChange.toFixed(1)}%`;
              pctClass = "pct-pos bg-pos";
            } else if (pctChange < 0) {
              pctStr = `${pctChange.toFixed(1)}%`;
              pctClass = "pct-neg bg-neg";
            } else {
              pctStr = `0.0%`;
              pctClass = "pct-neu bg-neu";
            }
          }
          
          workoutPayload.progress[ex.name] = { str: pctStr, cls: pctClass };
          
          reportHtml += `
            <div class="report-item">
              <span>${ex.name}</span>
              <span class="pct-badge ${pctClass}">${pctStr}</span>
            </div>
          `;
        }
      });

      appData.history.push(workoutPayload);
      saveData();
      
      document.getElementById('modalReportList').innerHTML = reportHtml;
      document.getElementById('progressModal').style.display = 'flex';
      
      window.renderExercises();
    }

    window.closeModal = function() {
      document.getElementById('progressModal').style.display = 'none';
    }

    window.logBodyWeight = function() {
      const val = parseFloat(document.getElementById('bwInput').value);
      if (!val || isNaN(val)) return;
      appData.bodyWeights.push({
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
        weight: val,
        timestamp: Date.now()
      });
      document.getElementById('bwInput').value = '';
      saveData();
      window.updateBwHeader();
    }

    window.updateBwHeader = function() {
      const display = document.getElementById('lastBwDisplay');
      if (appData.bodyWeights && appData.bodyWeights.length > 0) {
        const last = appData.bodyWeights[appData.bodyWeights.length - 1];
        display.innerText = `Last: ${last.weight} kg (${last.date})`;
      } else {
        display.innerText = "Last: Not logged";
      }
    }

    window.renderHistory = function() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';
      
      if (appData.history.length === 0 && (!appData.bodyWeights || appData.bodyWeights.length === 0)) {
        container.innerHTML = '<div style="color:var(--ash); font-size:0.85rem; padding:20px; text-align:center;">No history recorded yet.</div>';
        return;
      }

      // OVERALL PROGRESSIVE OVERLOAD CALCULATION (30-DAY)
      if (appData.history.length >= 2) {
        let chunkSize = Math.min(30, Math.floor(appData.history.length / 2));
        
        const latestChunk = appData.history.slice(-chunkSize);
        const prevChunk = appData.history.slice(-(chunkSize * 2), -chunkSize);
        
        let latestVol = 0;
        let prevVol = 0;
        
        const calcTotal = (chunk) => {
           let total = 0;
           chunk.forEach(w => {
              for (let ex in w.exercises) {
                 w.exercises[ex].forEach(s => {
                    let weight = s.kg > 0 ? s.kg : 1;
                    total += (s.reps * weight);
                 });
              }
           });
           return total;
        };

        latestVol = calcTotal(latestChunk);
        prevVol = calcTotal(prevChunk);

        if (prevVol > 0) {
           let pctChange = ((latestVol - prevVol) / prevVol) * 100;
           let pctClass = pctChange >= 0 ? 'pct-pos' : 'pct-neg';
           let pctStr = pctChange >= 0 ? `+${pctChange.toFixed(1)}%` : `${pctChange.toFixed(1)}%`;
           
           const trendCard = document.createElement('div');
           trendCard.className = 'history-card';
           trendCard.style.border = '1px solid var(--card-border)';
           trendCard.style.background = '#151515';
           trendCard.innerHTML = `
             <div class="hist-head" style="color:var(--white); border-bottom:1px solid var(--accent);">
               <span>OVERALL PROGRESSION</span>
               <span>${chunkSize} VS ${chunkSize} SESSIONS</span>
             </div>
             <div style="display:flex; align-items:center; gap:16px; margin-top:16px; margin-bottom:8px;">
               <div style="font-size:2rem; font-weight:800;" class="${pctClass}">${pctStr}</div>
               <div style="font-size:0.75rem; color:var(--ash-light); line-height:1.4;">
                 Total volume progression comparing your last ${chunkSize} workouts against the ${chunkSize} workouts prior.
               </div>
             </div>
           `;
           container.appendChild(trendCard);
        }
      }

      if (appData.bodyWeights && appData.bodyWeights.length > 0) {
        const bwCard = document.createElement('div');
        bwCard.className = 'history-card';
        bwCard.innerHTML = `<div class="hist-head"><span>BODY WEIGHT LOGS</span><span>${appData.bodyWeights.length} ENTRIES</span></div>`;
        appData.bodyWeights.slice(-5).reverse().forEach(b => {
          bwCard.innerHTML += `<div class="hist-entry"><span>${b.date}</span><strong style="color:var(--white);">${b.weight} kg</strong></div>`;
        });
        container.appendChild(bwCard);
      }

      appData.history.slice().reverse().forEach(h => {
        const card = document.createElement('div');
        card.className = 'history-card';
        let exHtml = '';
        for (let name in h.exercises) {
          const sets = h.exercises[name];
          const prog = h.progress && h.progress[name] ? h.progress[name] : { str: '', cls: '' };
          const summary = sets.map(s => `${s.kg}kg×${s.reps}`).join(' | ');
          exHtml += `
            <div class="hist-entry" style="display:block; margin-bottom:12px;">
              <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                <span style="color:var(--white); font-weight:700;">${name}</span>
                ${prog.str ? `<span class="pct-badge ${prog.cls}">${prog.str} VOL</span>` : ''}
              </div>
              <div style="font-size:0.75rem; color:var(--ash-light);">${summary}</div>
            </div>`;
        }
        card.innerHTML = `<div class="hist-head"><span>${h.type}</span><span>${h.date}</span></div>${exHtml}`;
        container.appendChild(card);
      });
    }

    // Launch
    loadData();
  </script>
</body>
</html>
